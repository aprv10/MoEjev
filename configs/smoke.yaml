experiment:
  name: baseline-top2-smoke
  seed: 1337
  output_dir: results

data:
  dataset: wikitext-2-raw-v1
  cache_dir: data/cache
  max_train_tokens: 100000
  max_validation_tokens: 20000

model:
  sequence_length: 64
  num_layers: 2
  model_dim: 128
  num_heads: 4
  dense_hidden_dim: 512
  expert_hidden_dim: 512
  num_experts: 4
  moe_layers: [1]
  dropout: 0.0

router:
  type: baseline_top_k
  top_k: 2
  load_balance_weight: 0.01
  z_loss_weight: 0.001

training:
  batch_size: 2
  gradient_accumulation_steps: 2
  max_steps: 5
  warmup_steps: 2
  learning_rate: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.95]
  max_gradient_norm: 1.0
  mixed_precision: fp16
  num_workers: 0
  log_every: 1
  validation_batches: 5

